[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-pet-dynamics-science"
version = "0.1.0"
description = "Reproducible SuStaIn and OT-CFM pipeline for amyloid-beta and tau PET"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "STORM contributors"}]
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "PyYAML>=6,<7",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
sustain = [
  "matplotlib>=3.8,<4",
  "pathos>=0.3,<1",
  "tqdm>=4.66,<5",
  "pysustain @ git+https://github.com/ucl-pond/pySuStaIn.git@708fa22d89c9692dbeafcc2c31a1c8460ced5640",
]
ot-cfm = [
  "torch>=2.2,<3",
  "POT>=0.9,<1",
  "matplotlib>=3.8,<4",
  "umap-learn>=0.5,<1",
]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
storm-pet-science = "storm_pet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
